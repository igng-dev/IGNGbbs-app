name: CI

# 2026-09-27 首版失败的修复：runner 镜像自带 Android SDK，原先额外调用的
# android-actions/setup-android@v3 会去安装已被 Google 下架的 tools 包而崩溃，故删除该步骤。

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 隐私与凭据卫生检查
        run: bash scripts/check-privacy.sh --all
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: 剔除机器专属 SDK 路径（local.properties 不该进仓库）
        run: |
          cd "Android"
          if [ -f local.properties ] && git ls-files --error-unmatch local.properties >/dev/null 2>&1; then
            echo "::warning file=local.properties::local.properties 被提交进仓库，CI 已临时删除；请把它加入 .gitignore"
            rm -f local.properties
          fi
      - name: 构建 debug APK
        working-directory: Android
        run: sh ./gradlew assembleDebug --no-daemon --stacktrace
      - name: 构建未签名 release APK（校验 R8 裁剪）
        working-directory: Android
        run: sh ./gradlew assembleRelease --no-daemon --stacktrace
      - name: 校验 release DEX 保留 WorkDatabase_Impl 构造器与 Worker 执行体
        run: |
          set -eu
          APK=$(ls Android/app/build/outputs/apk/release/*.apk | head -n 1)
          DEXDUMP=$(ls "$ANDROID_HOME"/build-tools/*/dexdump | sort -V | tail -n 1)
          DEX_TMP=$(mktemp -d)
          trap 'rm -rf "$DEX_TMP"' EXIT
          unzip -q -o "$APK" 'classes*.dex' -d "$DEX_TMP"
          : > "$DEX_TMP/dex.txt"
          for dex in "$DEX_TMP"/classes*.dex; do
            "$DEXDUMP" "$dex" >> "$DEX_TMP/dex.txt"
          done
          python3 - "$DEX_TMP/dex.txt" <<'PY'
          import sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          classes = {}
          for c in text.split("\nClass #")[1:]:
              for line in c.splitlines()[:5]:
                  if "Class descriptor  : '" in line:
                      classes[line.split("'")[1]] = c
                      break
          wd = classes.get("Landroidx/work/impl/WorkDatabase_Impl;", "")
          assert "name          : '<init>'" in wd, "WorkDatabase_Impl.<init>() was stripped by R8!"
          nw = classes.get("Lnet/igng/bbs/NotificationSyncWorker;", "")
          assert "name          : '<init>'" in nw, "NotificationSyncWorker.<init>() was stripped by R8!"
          vm = nw.split("Virtual methods   -")[-1]
          assert "name          :" in vm, "NotificationSyncWorker virtual methods (doWork) were stripped by R8!"
          print("Release DEX check passed: WorkDatabase_Impl.<init>() and NotificationSyncWorker methods preserved.")
          PY
      - name: 单元测试
        working-directory: Android
        run: sh ./gradlew testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk-${{ github.event.number || github.sha }}
          path: Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
