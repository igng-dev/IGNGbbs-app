name: CI

# 2026-09-27 首版失败的修复：runner 镜像自带 Android SDK，原先额外调用的
# android-actions/setup-android@v3 会去安装已被 Google 下架的 tools 包而崩溃，故删除该步骤。

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 隐私与凭据卫生检查
        run: |
          bash scripts/check-privacy.sh --all
          sh -n scripts/check-privacy.sh
          sh -n .githooks/pre-commit
          bash -n .githooks/pre-push
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/verify-release-dex.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: 构建 debug APK
        working-directory: Android
        run: sh ./gradlew assembleDebug --no-daemon --stacktrace
      - name: 构建未签名 release APK（校验 R8 裁剪）
        working-directory: Android
        run: sh ./gradlew assembleRelease --no-daemon --stacktrace
      - name: 校验 release DEX 保留 WorkDatabase_Impl 构造器与 Worker 执行体
        run: |
          set -eu
          APK=$(ls Android/app/build/outputs/apk/release/*.apk | head -n 1)
          python3 scripts/verify-release-dex.py "$APK"
      - name: 单元测试
        working-directory: Android
        run: sh ./gradlew testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk-${{ github.event.number || github.sha }}
          path: Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
